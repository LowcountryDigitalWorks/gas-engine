name: Gate lockfile bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'gate/1.0-cloud-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate deterministic package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit package lock for connector reconciliation
        run: |
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_BASE64_END
