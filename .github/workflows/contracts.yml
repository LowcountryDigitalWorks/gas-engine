name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, test, and check schema drift
        run: npm run check
      - name: Run local Cloudflare gate proof
        run: npm run gate:cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Audit locked npm dependencies
        run: npm audit
      - name: Verify patch whitespace and tracked files
        run: |
          git diff --check
          git diff --exit-code
